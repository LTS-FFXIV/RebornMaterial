name: Publish
on:
  push:
    tags:
      - '*.*.*'
jobs:
  Build:
    permissions:
      contents: write
      id-token: write # NuGet Trusted Publishing exchanges the GitHub OIDC token for a short-lived API key.
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Get Environment Variables
        run: |
          $tag = "${{ github.ref }}" -replace 'refs/tags/', ''

          "tag=$tag" | Out-File -Append -FilePath $Env:GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud Latest
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore NuGet Packages
        run: dotnet restore RebornMaterial/RebornMaterial.csproj

      - name: Build Library
        run: dotnet build --no-restore -c Release RebornMaterial/RebornMaterial.csproj -p:Version=${{ env.tag }}

      - name: Pack Library
        run: dotnet pack --no-build -c Release RebornMaterial/RebornMaterial.csproj -p:Version=${{ env.tag }} --output .\artifacts

      - name: NuGet Login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: dotnet nuget push .\artifacts\*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./artifacts/*.nupkg
          prerelease: ${{ contains(env.tag, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}
